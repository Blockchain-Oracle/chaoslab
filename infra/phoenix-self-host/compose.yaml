# Phoenix self-hosted — local + VPS-deployable
#
# Why this exists: Phoenix Cloud free tier is 25,000 spans/month. RAT-2 measured
# ~41 spans per A2A round-trip, so ~13 full audits/month max on free tier. Dev
# iteration alone would blow through the quota in a day. Self-hosting Phoenix
# locally (and later on Abu's VPS) gives us unlimited tracing for free.
#
# Local usage (with Colima running):
#   cd infra/phoenix-self-host && docker compose up -d
#   open http://localhost:6006  (Phoenix UI)
#   # OTLP collector available at http://localhost:6006/v1/traces
#
# VPS deployment (when Abu has it on his VPS):
#   scp -r infra/phoenix-self-host abu@vps:/srv/phoenix
#   ssh abu@vps "cd /srv/phoenix && docker compose up -d"
#   # Expose port 6006 behind nginx + TLS for remote use
#
# Stop:
#   docker compose down            # keeps data
#   docker compose down -v         # destroys data (volume)

services:
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: phoenix-self-host
    restart: unless-stopped

    # Phoenix exposes:
    #   6006 — UI + REST API (HTTP)
    #   4317 — OTLP gRPC ingest (optional; we use 6006/v1/traces over HTTP)
    ports:
      - "6006:6006"
      - "4317:4317"

    # Persistent storage — SQLite database for spans + experiments + datasets.
    # When you `docker compose down -v`, this is destroyed; without -v it stays.
    volumes:
      - phoenix-data:/mnt/data

    environment:
      # Storage backend — SQLite is fine for our scale (mid-market customers
      # running ~100 audits/month per tenant). For >10K spans/day, switch to
      # PHOENIX_SQL_DATABASE_URL=postgresql+psycopg2://... per Phoenix docs.
      - PHOENIX_WORKING_DIR=/mnt/data

      # Auth: by default Phoenix self-hosted is open. For VPS deploys, set
      # PHOENIX_ENABLE_AUTH=true + a strong PHOENIX_SECRET. We leave it open
      # for local dev since traffic is localhost-only.
      - PHOENIX_ENABLE_AUTH=false

      # Optional log level (debug | info | warning | error)
      - PHOENIX_LOG_LEVEL=info

    # Healthcheck — verifies Phoenix is actually serving on 6006
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6006/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  phoenix-data:
    name: phoenix-self-host-data
