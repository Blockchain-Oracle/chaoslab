# gitleaks config — uses the singular `[allowlist]` table (global allowlist).
# CRITICAL: the plural `[[allowlists]]` array-of-tables form looks similar but is per-rule
# scope only — using it at top level silently disables all carve-outs (verified empirically
# on v8.21.0). See audit-notes.md IF-1 and IF-6 for the full story.
# Pinned via .pre-commit-config.yaml rev v8.21.0.

[extend]
useDefault = true

[allowlist]
description = "Carve-outs for license text, research corpus, spec files, and generated lockfiles"
paths = [
  '''^LICENSE$''',
  '''^research/''',
  '''^docs/''',
  '''(uv\.lock|pnpm-lock\.yaml|package-lock\.json)$''',
]

# Resend API keys (re_ prefix) — the default ruleset missed one in a notes
# file on 2026-06-10; never again.
[[rules]]
id = "resend-api-key"
description = "Resend API key"
regex = '''re_[A-Za-z0-9]{8}_[A-Za-z0-9]{20,}'''
keywords = ["re_"]
