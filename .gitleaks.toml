# gitleaks config — targets gitleaks >=v8.18 schema (`[[allowlists]]` block with
# `paths` as an array of regex strings). Pinned via .pre-commit-config.yaml rev v8.21.0.
# Legacy `[[allowlist.paths]]` per-path blocks no longer parse on v8.21+ — see audit-notes.md.

[extend]
useDefault = true

[[allowlists]]
description = "Carve-outs for license text, research corpus, spec files, and generated lockfiles"
paths = [
  '''^LICENSE$''',
  '''^research/''',
  '''^docs/''',
  '''(uv\.lock|pnpm-lock\.yaml|package-lock\.json)$''',
]
