# Staging deploy — build + push + blue/green Cloud Run promotion.
#
# ADR-008 build-once-promote-everywhere: every push to main produces a
# :${{ github.sha }} image tag. Prod (S1.7) promotes the SAME image hash;
# no rebuild between staging and prod.
#
# ADR-009 Workload Identity Federation: auth uses google-github-actions/auth@v3
# with WIF. No JSON keys ever touch the repo or runner. WIF + SA + Variables
# bootstrap by infra/workload-identity-federation.sh (S1.4).

name: staging-deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required by WIF; declared at workflow level + each deploy job

env:
  REGION: us-central1
  PROJECT_ID: ${{ vars.STAGING_PROJECT_ID }}
  DEPLOY_SA: ${{ vars.GCP_SERVICE_ACCOUNT }}
  RUNTIME_SA: ${{ vars.RUNTIME_SA_STAGING }}
  WIF_PROVIDER: ${{ vars.WIF_PROVIDER_NAME }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      agent: ${{ steps.filter.outputs.agent }}
      web: ${{ steps.filter.outputs.web }}
      target_agent: ${{ steps.filter.outputs.target_agent }}
    steps:
      - uses: actions/checkout@v6
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            agent:
              - 'apps/phoenix-audit-agent/**'
              - 'pyproject.toml'
              - 'uv.lock'
            web:
              - 'apps/phoenix-audit-web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            target_agent:
              - 'apps/target-agent/**'

  build-and-deploy:
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # WIF requires JOB-level permission (GOTCHA-4 from S1.4)
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: phoenix-audit-agent
            path: apps/phoenix-audit-agent
            changed_key: agent
            dockerfile: apps/phoenix-audit-agent/Dockerfile
            smoke_path: /health
            # IAM-gated — only the web service (runtime SA), Cloud Scheduler
            # and CI invoke it. SELF URL + invoker email resolve at deploy time
            # (scheduler-tick OIDC verification; fail-closed when unset).
            auth_flag: --no-allow-unauthenticated
            # KMS_SIGNING_KEY_VERSION: without it every run logs CRITICAL and
            # skips the signed report (key provisioned by infra/workload-
            # identity-federation.sh; staging never had it until 2026-06-10).
            # TARGET_PHOENIX_PROJECT=phoenix-audit: re-verified 2026-06-11
            # while diagnosing IF-19 — Phoenix Cloud routes child spans to
            # whichever project owns the trace_id's root/parent span. Since
            # the auditor's `phoenix-audit.adapter.adk.invoke` span lands
            # first under phoenix-audit, the target's downstream agent_run/
            # call_llm/execute_tool spans (sharing the trace_id via
            # W3C traceparent propagation) get routed into phoenix-audit
            # too. The earlier `target-agent` value was wrong: the target's
            # tracer is registered with project_name=target-agent, but
            # Phoenix overrides per-trace based on root-span ownership.
            # Verified with traces `3043eca1...` and `c72c3e3b...` from
            # run_fddd5de82845.
            # PUBLIC_WEB_URL (story-9.5/C3): portal links in emails + the
            # OAuth exchange's settings-redirect target — the live domain.
            # GITLAB_OAUTH_REDIRECT_URI (story-9.17): must EXACTLY match a
            # redirect URI registered on the GitLab OAuth app.
            extra_env: ",SERVICE_BASE_URL=__RESOLVE_SELF_URL__,SCHEDULER_INVOKER_EMAIL=__DEPLOY_SA__,FIREBASE_PROJECT_ID=__PROJECT_ID__,DEMO_TARGET_URL=__RESOLVE_TARGET_AGENT_URL__,KMS_SIGNING_KEY_VERSION=projects/__PROJECT_ID__/locations/us-central1/keyRings/phoenix-audit/cryptoKeys/report-signer/cryptoKeyVersions/1,TARGET_PHOENIX_PROJECT=phoenix-audit,PUBLIC_WEB_URL=https://phxaudit.xyz,GITLAB_OAUTH_REDIRECT_URI=https://phxaudit.xyz/integrations/gitlab/callback,PHOENIX_UI_BASE=https://app.phoenix.arize.com/s/blockchainoracle-dev"
            # resend-api-key (story-9.5) + gitlab-oauth-* (story-9.17) were
            # provisioned in Secret Manager 2026-06-10 and runtime-SA bound.
            extra_secrets: ",RESEND_API_KEY=resend-api-key:latest,GITLAB_OAUTH_CLIENT_ID=gitlab-oauth-client-id:latest,GITLAB_OAUTH_CLIENT_SECRET=gitlab-oauth-client-secret:latest"
            # The run registry + SSE queues are in-process (main.py): a second
            # instance means POST /run and GET /stream can land on different
            # pods → 404 mid-demo. One instance trivially handles the audit.
            max_instances: 1

          - service: target-agent
            path: apps/target-agent
            changed_key: target_agent
            dockerfile: apps/target-agent/Dockerfile
            # A2A agent — no FastAPI /health; the agent-card endpoint is the
            # standard "is the container alive" probe.
            smoke_path: /.well-known/agent.json
            # Sacrificial demo bot — public so the (IAM-gated) audit agent can
            # probe it without service-to-service token plumbing in adapters.
            # FAULT_HOOKS_ENABLED opts this target into Phoenix Audit's remote
            # fault delivery (/hooks/adk) — the surface every real probe needs.
            auth_flag: --allow-unauthenticated
            # PUBLIC_URL fixes issue #22: without it the agent card advertises
            # http://localhost:8001 and every A2A message/send dispatches to
            # localhost — baseline fails 0/5 on any audit against this target.
            extra_env: ",FAULT_HOOKS_ENABLED=true,PUBLIC_URL=__RESOLVE_SELF_URL__"
            # --no-cpu-throttling: Phoenix's SimpleSpanProcessor exports each
            # span synchronously via HTTPS POST. With Cloud Run's default
            # cpu-throttling=true, CPU is throttled to ~5% the moment the HTTP
            # response is sent — ADK's `agent_run`/`call_llm`/`execute_tool`
            # spans end during a window where the OTLP POST stalls and the
            # span is silently dropped. The auditor service avoids this
            # because its SSE stream stays open for the full audit (~90s) so
            # CPU stays allocated. The target serves short, discrete probes
            # and needs always-allocated CPU to flush spans. Diagnosed
            # 2026-06-11: live target produced 0 spans across 24h+ while
            # local target with same image+env emitted 50 spans per probe.
            extra_flags: --no-cpu-throttling
            max_instances: 10
          - service: phoenix-audit-web
            path: apps/phoenix-audit-web
            changed_key: web
            dockerfile: apps/phoenix-audit-web/Dockerfile
            smoke_path: /
            # The public judge-facing site. It reaches the IAM-gated agent via
            # /api/agent (server-minted ID tokens); AGENT_URL is resolved from
            # the live service at deploy time (see the deploy step).
            auth_flag: --allow-unauthenticated
            extra_env: ",AGENT_URL=__RESOLVE_AGENT_URL__"
            # Session-cookie signing keys (story-9.4) — web only.
            extra_secrets: ",AUTH_COOKIE_SIGNATURE_KEYS=cookie-signature-keys:latest"
            # NEXT_PUBLIC_* are inlined into the client bundle at BUILD time.
            # Values live in GitHub repo VARIABLES (public client config, not
            # secrets — the apiKey identifies the Firebase project; security
            # lives in token verification — but gitleaks rightly refuses
            # anything key-shaped in the tree).
            build_args: |
              NEXT_PUBLIC_FIREBASE_API_KEY=${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
              NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
              NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            max_instances: 10
    steps:
      - name: Determine if this service changed
        id: changed
        run: |
          case "${{ matrix.changed_key }}" in
            agent) v="${{ needs.detect-changes.outputs.agent }}" ;;
            web) v="${{ needs.detect-changes.outputs.web }}" ;;
            target_agent) v="${{ needs.detect-changes.outputs.target_agent }}" ;;
            *) v="false" ;;
          esac
          echo "value=${v}" >> "${GITHUB_OUTPUT}"

      - name: Skip if unchanged
        if: steps.changed.outputs.value != 'true' && github.event_name != 'workflow_dispatch'
        run: |
          echo "::notice::${{ matrix.service }} unchanged — skipping build + deploy"

      - uses: actions/checkout@v6
        if: steps.changed.outputs.value == 'true' || github.event_name == 'workflow_dispatch'

      - name: Guard required repo variables
        if: steps.changed.outputs.value == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -e
          [ -n "${PROJECT_ID}" ] || { echo "::error::STAGING_PROJECT_ID unset"; exit 1; }
          [ -n "${DEPLOY_SA}" ] || { echo "::error::GCP_SERVICE_ACCOUNT unset"; exit 1; }
          [ -n "${RUNTIME_SA}" ] || { echo "::error::RUNTIME_SA_STAGING unset"; exit 1; }
          [ -n "${WIF_PROVIDER}" ] || { echo "::error::WIF_PROVIDER_NAME unset"; exit 1; }

      - name: Auth to Google Cloud (WIF)
        if: steps.changed.outputs.value == 'true' || github.event_name == 'workflow_dispatch'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Set up gcloud
        if: steps.changed.outputs.value == 'true' || github.event_name == 'workflow_dispatch'
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Docker Buildx
        if: steps.changed.outputs.value == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: Configure Artifact Registry docker auth
        if: steps.changed.outputs.value == 'true' || github.event_name == 'workflow_dispatch'
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build + push (cached per-service)
        if: steps.changed.outputs.value == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/phoenix-audit/${{ matrix.service }}:${{ github.sha }}
          build-args: ${{ matrix.build_args || '' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Detect existing Cloud Run service (blue/green eligibility)
        if: steps.changed.outputs.value == 'true' || github.event_name == 'workflow_dispatch'
        id: bluegreen
        run: |
          # `--no-traffic --tag=candidate` is illegal on first creation;
          # gate the candidate path on whether the service already exists.
          if gcloud run services describe "${{ matrix.service }}" --region="${REGION}" >/dev/null 2>&1; then
            echo "value=true" >> "${GITHUB_OUTPUT}"
          else
            echo "value=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::First deploy of ${{ matrix.service }} — skipping candidate tag + smoke + promote"
          fi

      - name: Deploy to Cloud Run
        if: steps.changed.outputs.value == 'true' || github.event_name == 'workflow_dispatch'
        env:
          # Phoenix provider config per ADR-017. We use Arize Phoenix Cloud
          # as the demo backend (track-partner-aligned, free-tier covers
          # judging window). Self-hosted Docker stays documented in
          # infra/phoenix-self-host/ as the OSS distribution alternative.
          # phoenix-audit-web ignores these — its stub doesn't emit traces.
          PHOENIX_PROVIDER: customer
          # Space-scoped URL is REQUIRED on Phoenix Cloud — the bare host 401s
          # every export AND the judge's rubric reads (RAT-results.md C1).
          PHOENIX_COLLECTOR_ENDPOINT: https://app.phoenix.arize.com/s/blockchainoracle-dev/v1/traces
        run: |
          if [ "${{ steps.bluegreen.outputs.value }}" = "true" ]; then
            CANDIDATE_FLAGS="--tag=candidate --no-traffic"
          else
            CANDIDATE_FLAGS=""
          fi
          # Resolve the agent URL from the LIVE service — a hardcoded hostname
          # would silently mis-wire web->agent on a recreated service or a
          # forked project. Fails loud if the agent has never been deployed.
          EXTRA_ENV='${{ matrix.extra_env }}'
          # // = replace ALL occurrences — extra_env carries the placeholder
          # twice (FIREBASE_PROJECT_ID + KMS_SIGNING_KEY_VERSION).
          EXTRA_ENV="${EXTRA_ENV//__PROJECT_ID__/${PROJECT_ID}}"
          if [ "${EXTRA_ENV#*__RESOLVE_AGENT_URL__}" != "${EXTRA_ENV}" ]; then
            AGENT_URL=$(gcloud run services describe phoenix-audit-agent \
              --region="${REGION}" --format='value(status.url)')
            [ -n "${AGENT_URL}" ] || { echo "::error::phoenix-audit-agent service not found — deploy the agent before the web"; exit 1; }
            EXTRA_ENV="${EXTRA_ENV/__RESOLVE_AGENT_URL__/${AGENT_URL}}"
          fi
          if [ "${EXTRA_ENV#*__RESOLVE_TARGET_AGENT_URL__}" != "${EXTRA_ENV}" ]; then
            TARGET_URL=$(gcloud run services describe target-agent \
              --region="${REGION}" --format='value(status.url)' 2>/dev/null || true)
            # First-ever deploy: seed keeps the localhost default until the
            # target exists; the next deploy fills it in.
            EXTRA_ENV="${EXTRA_ENV/__RESOLVE_TARGET_AGENT_URL__/${TARGET_URL:-http://localhost:8001}}"
          fi
          if [ "${EXTRA_ENV#*__RESOLVE_SELF_URL__}" != "${EXTRA_ENV}" ]; then
            SELF_URL=$(gcloud run services describe ${{ matrix.service }} \
              --region="${REGION}" --format='value(status.url)' 2>/dev/null || true)
            # First-ever deploy: URL unknown until the service exists; the tick
            # stays fail-closed (503) until the next deploy fills it in.
            EXTRA_ENV="${EXTRA_ENV/__RESOLVE_SELF_URL__/${SELF_URL}}"
            EXTRA_ENV="${EXTRA_ENV/__DEPLOY_SA__/${DEPLOY_SA}}"
          fi
          # shellcheck disable=SC2086  # CANDIDATE_FLAGS is a controlled flag string
          gcloud run deploy ${{ matrix.service }} \
            --image="${REGION}-docker.pkg.dev/${PROJECT_ID}/phoenix-audit/${{ matrix.service }}:${GITHUB_SHA}" \
            --region="${REGION}" \
            --platform=managed \
            --service-account="${RUNTIME_SA}" \
            --min-instances=0 \
            --max-instances=${{ matrix.max_instances }} \
            --memory=1Gi \
            --cpu=1 \
            --port=8080 \
            --cpu-boost \
            ${{ matrix.auth_flag }} \
            ${{ matrix.extra_flags || '' }} \
            --set-env-vars=ENVIRONMENT=staging,JUDGE_LLM=gemini-3.5-flash,SERVICE_VERSION="${GITHUB_SHA}",PHOENIX_PROVIDER=${PHOENIX_PROVIDER},PHOENIX_COLLECTOR_ENDPOINT=${PHOENIX_COLLECTOR_ENDPOINT},GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=global${EXTRA_ENV} \
            --set-secrets=PHOENIX_API_KEY=phoenix-api-key:latest${{ matrix.extra_secrets || '' }} \
            ${CANDIDATE_FLAGS}

      - name: Smoke-test candidate revision
        if: (steps.changed.outputs.value == 'true' || github.event_name == 'workflow_dispatch') && steps.bluegreen.outputs.value == 'true'
        id: smoke
        run: |
          # Extract the candidate URL via jq on the JSON form — gcloud's
          # `value(...)` projection mangles repeated fields with `;` joiners
          # which produced malformed URLs (e.g. `;https://...`).
          CANDIDATE_URL=$(gcloud run services describe ${{ matrix.service }} \
            --region="${REGION}" --format=json \
            | jq -r '.status.traffic[] | select(.tag == "candidate") | .url' \
            | head -1)
          if [ -z "${CANDIDATE_URL}" ]; then
            CANDIDATE_URL=$(gcloud run services describe ${{ matrix.service }} \
              --region="${REGION}" \
              --format='value(status.url)' | sed 's|https://|https://candidate---|')
          fi
          echo "candidate_url=${CANDIDATE_URL}"
          # Service runs with --no-allow-unauthenticated; smoke must present
          # an OIDC identity token. The deploy SA already has run.invoker
          # via roles/run.admin granted in workload-identity-federation.sh.
          # Cloud Run validates `aud` against the SERVICE's main URL, not
          # the tagged candidate URL. Mint the ID token with the main URL
          # as audience so the token passes auth even when curl hits the
          # candidate---* host.
          MAIN_URL=$(gcloud run services describe ${{ matrix.service }} \
            --region="${REGION}" --format='value(status.url)')
          ACCESS_TOKEN=$(gcloud auth print-access-token)
          ID_TOKEN=$(curl -sS -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/${DEPLOY_SA}:generateIdToken" \
            -d "{\"audience\":\"${MAIN_URL}\",\"includeEmail\":true}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['token'])")
          for i in 1 2 3 4 5; do
            HTTP_STATUS=$(curl -s -o /tmp/smoke-body \
              -H "Authorization: Bearer ${ID_TOKEN}" \
              -w "%{http_code}" "${CANDIDATE_URL}${{ matrix.smoke_path }}" || echo "000")
            echo "smoke attempt ${i}: HTTP ${HTTP_STATUS}"
            if [ "${HTTP_STATUS}" = "200" ]; then
              echo "smoke OK"
              exit 0
            fi
            sleep 6
          done
          echo "::error::smoke failed after 5 retries against ${CANDIDATE_URL}${{ matrix.smoke_path }}"
          cat /tmp/smoke-body | head -20
          exit 1

      - name: Promote candidate to 100% traffic
        if: (steps.changed.outputs.value == 'true' || github.event_name == 'workflow_dispatch') && steps.bluegreen.outputs.value == 'true'
        run: |
          gcloud run services update-traffic ${{ matrix.service }} \
            --to-latest \
            --region="${REGION}"

      - name: Cleanup candidate revision on failure
        if: failure() && steps.changed.outputs.value == 'true'
        run: |
          REV_NAME="${{ matrix.service }}-${GITHUB_SHA::8}"
          echo "Attempting cleanup of failed candidate revision ${REV_NAME}..."
          gcloud run revisions delete "${REV_NAME}" \
            --region="${REGION}" \
            --quiet || echo "(best-effort cleanup)"
