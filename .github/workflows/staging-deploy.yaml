# Staging deploy — build + push + blue/green Cloud Run promotion.
#
# ADR-008 build-once-promote-everywhere: every push to main produces a
# :${{ github.sha }} image tag. Prod (S1.7) promotes the SAME image hash;
# no rebuild between staging and prod.
#
# ADR-009 Workload Identity Federation: auth uses google-github-actions/auth@v3
# with WIF. No JSON keys ever touch the repo or runner. WIF + SA + Variables
# bootstrap by infra/workload-identity-federation.sh (S1.4).

name: staging-deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required by WIF; declared at workflow level + each deploy job

env:
  REGION: us-central1
  PROJECT_ID: ${{ vars.STAGING_PROJECT_ID }}
  DEPLOY_SA: ${{ vars.GCP_SERVICE_ACCOUNT }}
  RUNTIME_SA: ${{ vars.RUNTIME_SA_STAGING }}
  WIF_PROVIDER: ${{ vars.WIF_PROVIDER_NAME }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      agent: ${{ steps.filter.outputs.agent }}
      web: ${{ steps.filter.outputs.web }}
      target_agent: ${{ steps.filter.outputs.target_agent }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            agent:
              - 'apps/chaoslab-agent/**'
              - 'pyproject.toml'
              - 'uv.lock'
            web:
              - 'apps/chaoslab-web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            target_agent:
              - 'apps/target-agent/**'

  build-and-deploy:
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # WIF requires JOB-level permission (GOTCHA-4 from S1.4)
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: chaoslab-agent
            path: apps/chaoslab-agent
            changed_key: agent
            dockerfile: apps/chaoslab-agent/Dockerfile
          - service: target-agent
            path: apps/target-agent
            changed_key: target_agent
            dockerfile: apps/target-agent/Dockerfile
          - service: chaoslab-web
            path: apps/chaoslab-web
            changed_key: web
            dockerfile: apps/chaoslab-web/Dockerfile
    steps:
      - name: Determine if this service changed
        id: changed
        run: |
          case "${{ matrix.changed_key }}" in
            agent) v="${{ needs.detect-changes.outputs.agent }}" ;;
            web) v="${{ needs.detect-changes.outputs.web }}" ;;
            target_agent) v="${{ needs.detect-changes.outputs.target_agent }}" ;;
            *) v="false" ;;
          esac
          echo "value=${v}" >> "${GITHUB_OUTPUT}"

      - name: Skip if unchanged
        if: steps.changed.outputs.value != 'true' && github.event_name != 'workflow_dispatch'
        run: |
          echo "::notice::${{ matrix.service }} unchanged — skipping build + deploy"

      - uses: actions/checkout@v4
        if: steps.changed.outputs.value == 'true' || github.event_name == 'workflow_dispatch'

      - name: Guard required repo variables
        if: steps.changed.outputs.value == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -e
          [ -n "${PROJECT_ID}" ] || { echo "::error::STAGING_PROJECT_ID unset"; exit 1; }
          [ -n "${DEPLOY_SA}" ] || { echo "::error::GCP_SERVICE_ACCOUNT unset"; exit 1; }
          [ -n "${RUNTIME_SA}" ] || { echo "::error::RUNTIME_SA_STAGING unset"; exit 1; }
          [ -n "${WIF_PROVIDER}" ] || { echo "::error::WIF_PROVIDER_NAME unset"; exit 1; }

      - name: Auth to Google Cloud (WIF)
        if: steps.changed.outputs.value == 'true' || github.event_name == 'workflow_dispatch'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Set up gcloud
        if: steps.changed.outputs.value == 'true' || github.event_name == 'workflow_dispatch'
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Docker Buildx
        if: steps.changed.outputs.value == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: Configure Artifact Registry docker auth
        if: steps.changed.outputs.value == 'true' || github.event_name == 'workflow_dispatch'
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build + push (cached per-service)
        if: steps.changed.outputs.value == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/chaoslab/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Deploy to Cloud Run (candidate, no traffic)
        if: steps.changed.outputs.value == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          gcloud run deploy ${{ matrix.service }} \
            --image="${REGION}-docker.pkg.dev/${PROJECT_ID}/chaoslab/${{ matrix.service }}:${GITHUB_SHA}" \
            --region="${REGION}" \
            --platform=managed \
            --service-account="${RUNTIME_SA}" \
            --min-instances=0 \
            --max-instances=10 \
            --memory=1Gi \
            --cpu=1 \
            --port=8080 \
            --cpu-boost \
            --no-allow-unauthenticated \
            --set-env-vars=ENVIRONMENT=staging,JUDGE_LLM=gemini-3.5-flash,SERVICE_VERSION="${GITHUB_SHA}" \
            --tag=candidate \
            --no-traffic

      - name: Smoke-test candidate revision
        if: steps.changed.outputs.value == 'true' || github.event_name == 'workflow_dispatch'
        id: smoke
        run: |
          # Cloud Run candidate URL is in the deploy output; query it instead
          # of computing it (which requires the PROJECT_HASH that varies per
          # project + service combo).
          CANDIDATE_URL=$(gcloud run services describe ${{ matrix.service }} \
            --region="${REGION}" \
            --format='value(status.traffic.url)' \
            --filter='status.traffic.tag=candidate' | head -1)
          if [ -z "${CANDIDATE_URL}" ]; then
            CANDIDATE_URL=$(gcloud run services describe ${{ matrix.service }} \
              --region="${REGION}" \
              --format='value(status.url)' | sed 's|https://|https://candidate---|')
          fi
          echo "candidate_url=${CANDIDATE_URL}"
          for i in 1 2 3 4 5; do
            HTTP_STATUS=$(curl -s -o /tmp/smoke-body -w "%{http_code}" "${CANDIDATE_URL}/health" || echo "000")
            echo "smoke attempt ${i}: HTTP ${HTTP_STATUS}"
            if [ "${HTTP_STATUS}" = "200" ]; then
              echo "smoke OK"
              exit 0
            fi
            sleep 6
          done
          echo "::error::smoke failed after 5 retries against ${CANDIDATE_URL}/health"
          exit 1

      - name: Promote candidate to 100% traffic
        if: steps.changed.outputs.value == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          gcloud run services update-traffic ${{ matrix.service }} \
            --to-latest=100 \
            --region="${REGION}"

      - name: Cleanup candidate revision on failure
        if: failure() && steps.changed.outputs.value == 'true'
        run: |
          REV_NAME="${{ matrix.service }}-${GITHUB_SHA::8}"
          echo "Attempting cleanup of failed candidate revision ${REV_NAME}..."
          gcloud run revisions delete "${REV_NAME}" \
            --region="${REGION}" \
            --quiet || echo "(best-effort cleanup)"
