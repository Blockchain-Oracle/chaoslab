name: pr-checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on force-push to a PR — saves cost.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      ts: ${{ steps.filter.outputs.ts }}
      infra: ${{ steps.filter.outputs.infra }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v6
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            python:
              - 'apps/phoenix-audit-agent/**'
              - 'apps/target-agent/**'
              - 'pyproject.toml'
              - 'uv.lock'
            ts:
              - 'apps/phoenix-audit-web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            infra:
              - '.github/**'
              - 'scripts/**'
            shared:
              - 'docs/**'

  python-quality:
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Install Python via uv
        run: uv python install 3.12
      - name: uv sync
        run: uv sync --frozen --all-extras
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: ty check
        run: uv run ty check apps/phoenix-audit-agent apps/target-agent

  ts-quality:
    needs: detect-changes
    if: needs.detect-changes.outputs.ts == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm lint
      - name: format check
        run: pnpm format:check
      - name: typecheck
        run: pnpm typecheck
      # Production build — tsc/eslint/vitest all miss client/server module
      # violations (a client component importing next/headers transitively
      # held staging-web deploys back across PRs #110-#113 undetected).
      - name: production build
        run: pnpm --filter phoenix-audit-web build

  max-lines-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 400-line guard
        run: python3 scripts/check_max_lines.py --strict

  recipe-schema-drift:
    runs-on: ubuntu-latest
    needs: python-quality
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Install Python via uv
        run: uv python install 3.12
      - name: uv sync
        run: uv sync --frozen --all-extras
      - name: Regenerate exported JSON Schema
        run: uv run python scripts/export_recipe_schema.py
      - name: Fail if exported schema drifted from committed copy
        run: |
          if ! git diff --exit-code packages/shared-types/hardening-recipe.json; then
            echo "::error::packages/shared-types/hardening-recipe.json is stale — re-run scripts/export_recipe_schema.py and commit the result"
            exit 1
          fi

  python-tests:
    needs: python-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Install Python via uv
        run: uv python install 3.12
      - name: Install Pango (WeasyPrint PDF renderer, story-6.7)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: uv sync
        run: uv sync --frozen --all-extras
      - name: pytest (phoenix-audit-agent)
        working-directory: apps/phoenix-audit-agent
        run: uv run pytest tests/unit -v -m "not online"
      - name: pytest (target-agent)
        working-directory: apps/target-agent
        run: uv run pytest tests/unit -v -m "not online"

  ts-tests:
    needs: ts-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: test
        run: pnpm test

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  conventional-commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: webiny/action-conventional-commits@v1.3.0
