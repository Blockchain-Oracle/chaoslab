default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16 # MUST match `uv run ruff --version` (project lockfile)
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty-check
        name: ty type check
        entry: uv run ty check apps/chaoslab-agent apps/target-agent
        language: system
        pass_filenames: false
        types: [python]

      - id: check-max-lines
        name: Enforce 400-line limit
        entry: python3 scripts/check_max_lines.py --strict
        language: system
        pass_filenames: false
        always_run: true

      - id: eslint
        name: ESLint (changed TS files)
        entry: pnpm --filter chaoslab-web exec eslint --fix
        language: system
        files: \.(ts|tsx|js|jsx)$
        pass_filenames: true

      - id: prettier
        name: Prettier (changed files)
        # Workspace-root prettier — `--filter chaoslab-web exec` cd's into apps/chaoslab-web/
        # which then resolves relative file paths incorrectly. See audit-notes.md (S1.2 impl finding).
        entry: pnpm exec prettier --write
        language: system
        files: \.(ts|tsx|js|jsx|json|css|md)$
        pass_filenames: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.json]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
