## target-agent — the deliberately-naive customer-support agent Phoenix Audit audits.
## 3 tools (lookup_order, refund, escalate), weak prompt, no input validation.
## The 3 naive design choices map 1:1 to the 3 root causes Phoenix Audit's
## clusterer surfaces in the demo's cascade-flip moment.

[project]
name = "target-agent"
version = "0.1.0"
description = "Deliberately-naive customer-support ADK agent — Phoenix Audit's demo target."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Blockchain-Oracle", email = "ajweb3dev@gmail.com" },
]
dependencies = [
  # ADK — major-pinned per RAT-2 IF-9 (A2A is EXPERIMENTAL; range allows
  # CVE patches but blocks breaking 3.x). `[a2a]` extra adds A2A protocol
  # support but does NOT include sse-starlette which `to_a2a()` needs —
  # sse-starlette is added separately. See IF-10.
  "google-adk[a2a]>=2.1.0,<3.0.0",
  "sse-starlette>=3.4",
  # uvicorn — production ASGI server. [standard] pulls httptools + uvloop
  # for Cloud Run hot-path throughput. Used by main() in server.py and by
  # Cloud Run's container start command.
  "uvicorn[standard]>=0.34.0,<1.0.0",
  # OpenInference auto-instrumentation for ADK — emits the TOOL/AGENT spans
  # Phoenix Audit reads back for trace clustering. Wired in observability.py.
  "openinference-instrumentation-google-adk>=0.1.15,<1.0.0",
  # Phoenix register() + tracer provider builder. Wired in observability.py;
  # called BEFORE google.adk imports per ADR-005.
  "arize-phoenix-otel>=0.10,<1.0.0",
  # Phoenix REST client — used by integration test to poll Phoenix Cloud
  # for the spans the agent emitted (read-path verification). Workspace
  # root pins >=2.7.0 (per RAT-2 IF-11 — DataFrame API path); honor that.
  "arize-phoenix-client>=2.7.0,<3.0.0",
  # Google Secret Manager — PHOENIX_API_KEY fallback for Cloud Run prod
  # (env var is the local-dev shortcut; Secret Manager is the deploy path).
  "google-cloud-secret-manager>=2.28.0,<3.0.0",
  # Structured logging for any non-print diagnostic.
  "structlog>=24",
  # Pydantic — transitively required by ADK; declared explicitly for visibility.
  "pydantic>=2",
]

# Console-script entry: `uv run target-agent` launches the A2A server on
# $PORT (defaults to 8001 locally; Cloud Run injects $PORT=8080).
[project.scripts]
target-agent = "target_agent.server:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  # httpx — used by tests/integration to poll the live A2A server.
  # Transitively pulled by ADK already, declaring here for explicit intent.
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/target_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: integration tests that spawn the live A2A server in a thread (no external services)",
  "online: tests that hit a real network service and incur cost (Phoenix Cloud, Gemini)",
  "slow: tests that take >5s (docker build, full image rebuilds, etc.)",
]

[tool.ruff]
# Inherit lint config (line length, rule families) from the workspace root.
extend = "../../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use magic values, local imports, and asserts.
# Mirrors workspace-root config but per-app since ruff doesn't merge
# per-file-ignores across extend chains reliably.
"tests/**" = ["S101", "S105", "S106", "PLR2004", "PLC0415", "T201"]
