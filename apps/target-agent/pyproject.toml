## target-agent — the deliberately-naive customer-support agent ChaosLab attacks.
## 3 tools (lookup_order, refund, escalate), weak prompt, no input validation.
## Real implementation lands in Epic 2 (S2.1-S2.4); this story (S1.1) only creates the skeleton.

[project]
name = "target-agent"
version = "0.1.0"
description = "Deliberately-naive customer-support ADK agent — ChaosLab's victim."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Blockchain-Oracle", email = "ajweb3dev@gmail.com" },
]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/target_agent"]
