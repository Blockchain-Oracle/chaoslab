## chaoslab-agent — Phoenix Audit's orchestrator (ADK SequentialAgent: Injector -> Judge -> Patcher).
## Codename `chaoslab-agent` is intentional per CLAUDE.md (S1.6 rename to phoenix-audit-agent is pending).

[project]
name = "chaoslab-agent"
version = "0.1.0"
description = "Phoenix Audit orchestrator — audits AI agents via adversarial probes + Phoenix tracing."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Blockchain-Oracle", email = "ajweb3dev@gmail.com" },
]
dependencies = [
  # ADK — same major-pin discipline as target-agent. [a2a] for talking to ADK targets;
  # Epic 3's adapter layer will support plain HTTP too.
  "google-adk[a2a]>=2.1.0,<3.0.0",
  # FastAPI + uvicorn — the /run, /stream, /health, /agents endpoints.
  "fastapi>=0.115,<1.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0",
  # SSE — /stream endpoint streams RunEvent JSON frames to chaoslab-web.
  "sse-starlette>=3.4",
  # Phoenix — auto-instrumentation (ADK spans) + register() (Phoenix as tracer provider).
  "openinference-instrumentation-google-adk>=0.1.15,<1.0.0",
  "arize-phoenix-otel>=0.10,<1.0.0",
  "arize-phoenix-client>=2.7.0,<3.0.0",
  # Pydantic + settings — Settings(BaseSettings) loads PHOENIX_*, GEMINI_*, etc. from env.
  "pydantic>=2",
  "pydantic-settings>=2.0,<3.0",
  # httpx — target-agent calls + Phoenix REST. Async client.
  "httpx>=0.27,<1.0.0",
  # Structured logging.
  "structlog>=24",
  # Google Secret Manager — PHOENIX_API_KEY fallback for Cloud Run BYO mode.
  "google-cloud-secret-manager>=2.28.0,<3.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "respx>=0.21",
]

[project.scripts]
chaoslab-agent = "chaoslab_agent.main:run_uvicorn"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chaoslab_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "online: tests that hit real Phoenix / Gemini (cost-impacting; nightly only)",
  "integration: tests that span multiple components",
]
