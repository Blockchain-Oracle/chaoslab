## chaoslab-agent — the orchestrator (ADK SequentialAgent: Injector → Judge → Patcher).
## Real dependencies land in S4.1 (agent entrypoint). This story (S1.1) just establishes
## the workspace-member skeleton so `uv sync` resolves.

[project]
name = "chaoslab-agent"
version = "0.1.0"
description = "ChaosLab orchestrator — chaos engineering for AI agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Blockchain-Oracle", email = "ajweb3dev@gmail.com" },
]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chaoslab_agent"]
